name: "WLCS - Azure Enterprise Infrastructure Deployment"

on:
  push:
    branches:
      - main
      - feature/fase3-compute-bastion # <-- VOEG DIT TIJDELIJK TOE
    paths-ignore:
      - 'README.md'
      - 'docs/screenshots/**'

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================================
  # JOB 1: VALIDATE & SECURITY SCAN (Beide mappen scannen)
  # =========================================================================
  validate:
    name: "1. Code Validation & Security"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # Validatie voor Laag 1: Base
      - name: Terraform Init (Validation Base)
        working-directory: ./terraform/01_base
        run: terraform init -backend=false

      - name: Terraform Validate (Base)
        working-directory: ./terraform/01_base
        run: terraform validate

      # Validatie voor Laag 2: Addons
      - name: Terraform Init (Validation Addons)
        working-directory: ./terraform/02_addons
        run: terraform init -backend=false

      - name: Terraform Validate (Addons)
        working-directory: ./terraform/02_addons
        run: terraform validate

      # Trivy controleert de complete mappenstructuur op kwetsbaarheden
      - name: Run Trivy Security Scanner (IAC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  # =========================================================================
  # JOB 2: TERRAFORM PLAN (Plannen genereren voor base en addons)
  # =========================================================================
  plan:
    name: "2. Terraform Security Plan"
    needs: validate
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      # --- PLAN BASE ---
      - name: Terraform Init (Base)
        working-directory: ./terraform/01_base
        run: terraform init

      - name: Terraform Plan (Base)
        working-directory: ./terraform/01_base
        run: |
          terraform plan -out=tfplan_base \
            -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}" \
            -var "subscription_id_dev=${{ secrets.AZURE_SUBSCRIPTION_DEV }}"

      # --- PLAN ADDONS ---
      - name: Terraform Init (Addons)
        working-directory: ./terraform/02_addons
        run: terraform init

      - name: Terraform Plan (Addons)
        working-directory: ./terraform/02_addons
        run: |
          terraform plan -out=tfplan_addons \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}"

      # Upload beide plannen als Artifacts
      - name: Upload Base Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan_base
          path: ./terraform/01_base/tfplan_base
          retention-days: 1

      - name: Upload Addons Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan_addons
          path: ./terraform/02_addons/tfplan_addons
          retention-days: 1

  # =========================================================================
  # JOB 3: TERRAFORM APPLY (Gegate met Handmatige Goedkeuring)
  # =========================================================================
  apply:
    name: "3. Azure Infrastructure Apply"
    needs: plan
    runs-on: ubuntu-latest
    environment: 
      name: 'wlcs-infrastructure-production'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      # --- DEPLOY LAAG 1: BASE ---
      - name: Download Base Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan_base
          path: ./terraform/01_base

      - name: Terraform Init (Base)
        working-directory: ./terraform/01_base
        run: terraform init

      - name: Terraform Apply (Base)
        working-directory: ./terraform/01_base
        run: terraform apply -auto-approve tfplan_base

      # --- DEPLOY LAAG 2: ADDONS ---
      - name: Download Addons Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan_addons
          path: ./terraform/02_addons

      - name: Terraform Init (Addons)
        working-directory: ./terraform/02_addons
        run: terraform init

      - name: Terraform Apply (Addons)
        working-directory: ./terraform/02_addons
        run: terraform apply -auto-approve tfplan_addons
