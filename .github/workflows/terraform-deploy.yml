name: "WLCS - Azure Enterprise Infrastructure Deployment"

on:
  push:
    branches:
      - main
      - "feature/**"
    paths-ignore:
      - 'README.md'
      - 'docs/screenshots/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================================
  # JOB 1: VALIDATE & SECURITY SCAN
  # =========================================================================
  validate:
    name: "1. Code Validation & Security"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init & Validate
        run: |
          cd ./terraform/01_base
          terraform init -backend=false -migrate-state=false
          terraform validate

      - name: Terraform Init & Validate (Addons)
        run: |
          cd ./terraform/02_addons
          terraform init -backend=false -migrate-state=false
          terraform validate

      - name: Run Trivy Security Scanner (IAC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  # =========================================================================
  # JOB 2: TERRAFORM SPECULATIVE PLANS
  # =========================================================================
  generate_plans:
    name: "2. Generate Speculative Plans"
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      # PRO STEP: Haal het IP-adres van de runner op en zet de Key Vault tijdelijk open
      - name: Whitelist GitHub Runner IP
        run: |
          RUNNER_IP=$(curl -s https://ipify.org)
          echo "Runner IP is $RUNNER_IP"
          az keyvault network-rule add --name "kv-wlcs-log-dev-001" --resource-group "rg-wlcs-logistics-dev-001" --ip-address "$RUNNER_IP"
          sleep 10 # Wacht tot Azure de regel heeft verwerkt

      - name: Terraform Init & Plan (Base)
        run: |
          cd ./terraform/01_base
          terraform init
          terraform plan -out=tfplan_base \
            -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}" \
            -var "subscription_id_dev=${{ secrets.AZURE_SUBSCRIPTION_DEV }}"

      - name: Terraform Init & Plan (Addons)
        run: |
          cd ./terraform/02_addons
          terraform init
          terraform plan -out=tfplan_addons \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}"

      # PRO STEP: Sluit de firewall direct weer netjes af na het genereren van het plan
      - name: Remove GitHub Runner IP
        if: always()
        run: |
          RUNNER_IP=$(curl -s https://ipify.org)
          az keyvault network-rule remove --name "kv-wlcs-log-dev-001" --resource-group "rg-wlcs-logistics-dev-001" --ip-address "$RUNNER_IP"

      - name: Upload Base Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan_base
          path: ./terraform/01_base/tfplan_base
          retention-days: 1

      - name: Upload Addons Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan_addons
          path: ./terraform/02_addons/tfplan_addons
          retention-days: 1

  # =========================================================================
  # JOB 3: CORE BASE DEPLOYMENT (Draait op main en vereist GOEDKEURING)
  # =========================================================================
  apply_base:
    name: "3. Apply Core Infrastructure"
    needs: generate_plans
    if: github.ref == 'refs/heads/main'
    environment: 
      name: 'wlcs-infrastructure-production'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Download Base Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan_base
          path: ./terraform/01_base

      # PRO STEP: Ook tijdens de apply moet de runner er heel even in
      - name: Whitelist GitHub Runner IP for Apply
        run: |
          RUNNER_IP=$(curl -s https://ipify.org)
          az keyvault network-rule add --name "kv-wlcs-log-dev-001" --resource-group "rg-wlcs-logistics-dev-001" --ip-address "$RUNNER_IP"
          sleep 10

      - name: Terraform Init & Apply (Base)
        run: |
          cd ./terraform/01_base
          terraform init
          terraform apply -auto-approve tfplan_base

      # PRO STEP: Sluit de kluis onmiddellijk weer af
      - name: Remove GitHub Runner IP after Apply
        if: always()
        run: |
          RUNNER_IP=$(curl -s https://ipify.org)
          az keyvault network-rule remove --name "kv-wlcs-log-dev-001" --resource-group "rg-wlcs-logistics-dev-001" --ip-address "$RUNNER_IP"

  # =========================================================================
  # JOB 4: ADDONS DEPLOYMENT
  # =========================================================================
  apply_addons:
    name: "4. Apply Addons & Features"
    needs: apply_base 
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Download Addons Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan_addons
          path: ./terraform/02_addons

      - name: Terraform Init & Apply (Addons)
        run: |
          cd ./terraform/02_addons
          terraform init
          terraform apply -auto-approve tfplan_addons
