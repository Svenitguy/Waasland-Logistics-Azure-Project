name: "WLCS - Azure Enterprise Infrastructure Deployment"

on:
  push:
    branches:
      - main
      - "feature/**" # De pipeline start nu bij ELKE push (zowel feature als main)
    paths-ignore:
      - 'README.md'
      - 'docs/screenshots/**'
  workflow_dispatch: 

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================================
  # JOB 1: CODE VALIDATION (Draait ALTIJD: op feature én main)
  # =========================================================================
  validate:
    name: "1. Code Validation & Security"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init & Validate (Base)
        run: |
          cd ./terraform/01_base
          terraform init -backend=false
          terraform validate

  # =========================================================================
  # JOB 2: BASE INFRASTRUCTURE - PLAN (Draait ALTIJD: op feature én main)
  # =========================================================================
  plan_base:
    name: "2. Plan Core Infrastructure"
    needs: validate
    runs-on: ubuntu-latest
    environment: development # <--- HIER TOEGEVOEGD: Lost de OIDC-fout op via je bestaande dev-credential!
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Terraform Init & Plan (Base)
        id: plan
        run: |
          cd ./terraform/01_base
          terraform init
          terraform plan -out=tfplan_base \
            -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}" \
            -var "subscription_id_dev=${{ secrets.AZURE_SUBSCRIPTION_DEV }}"

      - name: Upload Base Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan_base
          path: ./terraform/01_base/tfplan_base
          retention-days: 1

  # =========================================================================
  # JOB 3: BASE INFRASTRUCTURE - APPLY (Draait STRICT alleen op main!)
  # =========================================================================
  apply_base:
    name: "3. Apply Core Infrastructure"
    needs: plan_base
    # DIT IS DE BEVEILIGING: Draait alleen als de code daadwerkelijk op main gepusht/gemerged is!
    if: github.ref == 'refs/heads/main'
    environment: 
      name: 'wlcs-infrastructure-production' # HIER stopt hij op main voor jouw goedkeuring
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Download Base Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan_base
          path: ./terraform/01_base

      - name: Terraform Init & Apply (Base)
        run: |
          cd ./terraform/01_base
          terraform init
          terraform apply -auto-approve tfplan_base

  # =========================================================================
  # JOB 4: DURE ADDONS - PLAN & APPLY (Alleen bij handmatige startknop!)
  # =========================================================================
  deploy_addons:
    name: "4. Deploy Dure Addons (Bastion, etc.)"
    # Draait ALLEEN als je specifiek op de handmatige 'Run workflow' knop klikt
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Terraform Init, Plan & Apply (Addons)
        run: |
          cd ./terraform/02_addons
          terraform init
          terraform plan -out=tfplan_addons \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}"
          terraform apply -auto-approve tfplan_addons
