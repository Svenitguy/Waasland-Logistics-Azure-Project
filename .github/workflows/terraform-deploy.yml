name: "WLCS - Azure Enterprise Infrastructure Deployment"

on:
  push:
    branches:
      - main
      - "feature/**"
    paths-ignore:
      - 'README.md'
      - 'docs/screenshots/**'
  workflow_dispatch: # <-- STAP 1: Dit activeert de handmatige "Run workflow" startknop in GitHub!

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================================
  # JOB 1: VALIDATE & SECURITY SCAN (Draait altijd bij elke push)
  # =========================================================================
  validate:
    name: "1. Code Validation & Security"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # Clean initialiseren en valideren met de herstelde paden (cd-methode)
      - name: Terraform Init & Validate
        run: |
          cd ./terraform/01_base
          terraform init -backend=false -migrate-state=false
          terraform validate

      - name: Terraform Init & Validate (Addons)
        run: |
          cd ./terraform/02_addons
          terraform init -backend=false -migrate-state=false
          terraform validate

      - name: Run Trivy Security Scanner (IAC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  # =========================================================================
  # JOB 2: TERRAFORM SPECULATIVE PLANS (Draait op feature-branches én main)
  # =========================================================================
  generate_plans:
    name: "2. Generate Speculative Plans"
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true
      # VOEG DEZE REGEL TOE: Dit dwingt Terraform om de certificaat-contactcheck over te slaan
      ARM_KEYVAULT_BYPASS_CERTIFICATE_CONTACTS_ERROR: "true" 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Terraform Init & Plan (Base)
        run: |
          cd ./terraform/01_base
          terraform init
          terraform plan -out=tfplan_base \
            -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}" \
            -var "subscription_id_dev=${{ secrets.AZURE_SUBSCRIPTION_DEV }}"

      - name: Terraform Init & Plan (Addons)
        run: |
          cd ./terraform/02_addons
          terraform init
          terraform plan -out=tfplan_addons \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}"

      - name: Upload Base Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan_base
          path: ./terraform/01_base/tfplan_base
          retention-days: 1

      - name: Upload Addons Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan_addons
          path: ./terraform/02_addons/tfplan_addons
          retention-days: 1

  # =========================================================================
  # JOB 3: CORE BASE DEPLOYMENT (Draait op main en vereist GOEDKEURING)
  # =========================================================================
  apply_base:
    name: "3. Apply Core Infrastructure"
    needs: generate_plans
    if: github.ref == 'refs/heads/main'
    environment: 
      name: 'wlcs-infrastructure-production'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true
      # VOEG DEZE REGEL OOK HIER TOE:
      ARM_KEYVAULT_BYPASS_CERTIFICATE_CONTACTS_ERROR: "true" 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Download Base Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan_base
          path: ./terraform/01_base

      - name: Terraform Init & Apply (Base)
        run: |
          cd ./terraform/01_base
          terraform init
          terraform apply -auto-approve tfplan_base

  # =========================================================================
  # JOB 4: ADDONS DEPLOYMENT (BEVEILIGD: Alleen bij HANDMATIGE startknop)
  # =========================================================================
  apply_addons:
    name: "4. Apply Addons & Features"
    needs: apply_base 
    # STAP 2: Harde FinOps conditie! Deze job draait UITSLUITEND op main én ALS er handmatig op de startknop wordt geklikt!
    # Bij een normale 'git push' wordt deze job dus altíjd veilig overgeslagen (skipped).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Download Addons Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan_addons
          path: ./terraform/02_addons

      - name: Terraform Init & Apply (Addons)
        run: |
          cd ./terraform/02_addons
          terraform init
          terraform apply -auto-approve tfplan_addons
