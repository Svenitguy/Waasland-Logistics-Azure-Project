
name: "WLCS - Terraform Enterprise Network Deployment"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'screenshots/**'

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================================
  # JOB 1: VALIDATE & SECURITY SCAN (De Kwaliteitsbewaker)
  # =========================================================================
  validate:
    name: "1. Code Validation & Security"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Init (Validation Only)
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      # HIER IS TRIVY: Scant je IaC code vóórdat er verbinding met Azure wordt gemaakt
      - name: Run Trivy Security Scanner (IAC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  # =========================================================================
  # JOB 2: TERRAFORM PLAN (Genereren en opslaan van wijzigingen)
  # =========================================================================
  plan:
    name: "2. Terraform Security Plan"
    needs: validate
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      use_oidc: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # Genereer het plan en sla het op als 'tfplan' file
      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan -out=tfplan \
            -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}" \
            -var "subscription_id_dev=${{ secrets.AZURE_SUBSCRIPTION_DEV }}"

      # Upload het plan zodat de Apply job exact ditzelfde bestand gebruikt
      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ./terraform/tfplan
          retention-days: 1

  # =========================================================================
  # JOB 3: TERRAFORM APPLY (Beveiligd met Handmatige Goedkeuring)
  # =========================================================================
  apply:
    name: "3. Azure Infrastructure Apply"
    needs: plan
    runs-on: ubuntu-latest
    environment: 
      name: 'wlcs-infrastructure-production'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      use_oidc: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      # Download het exact goedgekeurde plan-bestand uit Job 2
      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ./terraform

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # Voer de apply uit op basis van het beveiligde plan-bestand
      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan
