name: "WLCS - Azure Enterprise Infrastructure Deployment"

on:
  push:
    branches:
      - main
      - feature/**
    paths-ignore:
      - 'README.md'
      - 'docs/screenshots/**'

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: "1. Code Validation & Security"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init & Validate
        run: |
          cd ./terraform/01_base && terraform init -backend=false && terraform validate
          cd ../02_addons && terraform init -backend=false && terraform validate

      - name: Run Trivy Security Scanner (IAC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  # =========================================================================
  # JOB 2: CORE BASE INFRASTRUCTURE
  # =========================================================================
  deploy_base:
    name: "2. Core Base Infrastructure"
    needs: validate
    runs-on: ubuntu-latest
    environment: >-
      ${{ github.ref == 'refs/heads/main' && 'wlcs-infrastructure-production' || '' }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Terraform Init (Base)
        working-directory: ./terraform/01_base
        run: terraform init

      - name: Terraform Plan (Base)
        working-directory: ./terraform/01_base
        run: |
          terraform plan -out=tfplan_base \
            -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}" \
            -var "subscription_id_dev=${{ secrets.AZURE_SUBSCRIPTION_DEV }}"

      - name: Terraform Apply (Base)
        if: github.ref == 'refs/heads/main' # Alleen op main echt uitvoeren!
        working-directory: ./terraform/01_base
        run: terraform apply -auto-approve tfplan_base

  # =========================================================================
  # JOB 3: ADDONS & FEATURES (Draait NU OOK PLAN op feature-branches!)
  # =========================================================================
  deploy_addons:
    name: "3. Addons & Features Deployment"
    needs: deploy_base
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Terraform Init (Addons)
        working-directory: ./terraform/02_addons
        run: terraform init

      # Genereert het plan voor Bastion op ALLES branches (dus ook jouw feature branch!)
      - name: Terraform Plan (Addons)
        working-directory: ./terraform/02_addons
        run: |
          terraform plan -out=tfplan_addons \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}"

      # Voert de echte apply voor Bastion UITSLUITEND uit op de main branch!
      - name: Terraform Apply (Addons)
        if: github.ref == 'refs/heads/main'
        working-directory: ./terraform/02_addons
        run: terraform apply -auto-approve tfplan_addons
