name: "WLCS - Azure Base Infrastructure Destroy"

on:
  workflow_dispatch: 

permissions:
  id-token: write
  contents: read

jobs:
  destroy_base:
    name: "Destroy Core Base Infrastructure Only"
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      - name: Terraform Init (Base)
        working-directory: ./terraform/01_base
        run: terraform init

      # -------------------------------------------------------------------------
      # STEP 1 (PROFESSIONAL): Verwijder de resource uit de Terraform administratie.
      # Omdat de code van de DNS zone is gewist, mag Terraform deze niet meer beheren.
      # -------------------------------------------------------------------------
      - name: Terraform State Clean
        working-directory: ./terraform/01_base
        run: |
          echo "Verwijderen van de onbeheerde DNS-zone uit de Terraform State..."
          terraform state rm module.database.azurerm_private_dns_zone.sql_dns_zone || true

      # -------------------------------------------------------------------------
      # STEP 2 (PROFESSIONAL): Ruim de losstaande Azure resource eenmalig op via CLI.
      # Dit verbreekt de link en verwijdert de zone op de juiste Azure subscription.
      # -------------------------------------------------------------------------
      - name: Azure CLI Targeted Cleanup
        run: |
          echo "Schakel over naar de correcte Dev subscription..."
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_DEV }}"
          
          echo "Verwijderen van de netwerklink van de DNS-zone..."
          az network private-dns link vnet delete -g "rg-wlcs-logistics-dev-001" -z "privatelink.vaultcore.azure.net" -n "link-kv-dns-to-spoke" --yes || true
          
          echo "Verwijderen van de losstaande DNS-zone..."
          az network private-dns zone delete -g "rg-wlcs-logistics-dev-001" -n "privatelink.vaultcore.azure.net" --yes || true

      # -------------------------------------------------------------------------
      # STEP 3: Reguliere, veilige Terraform Destroy met behoud van de 'true' vlaggen!
      # -------------------------------------------------------------------------
      - name: Terraform Destroy (Base Only)
        working-directory: ./terraform/01_base
        run: |
          terraform destroy -auto-approve \
            -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}" \
            -var "subscription_id_dev=${{ secrets.AZURE_SUBSCRIPTION_DEV }}"
