name: "WLCS - Azure Base Infrastructure Destroy"

on:
  workflow_dispatch: 

permissions:
  id-token: write
  contents: read

jobs:
  destroy_base:
    name: "Destroy Core Base Infrastructure Only"
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # CAF/WAF RECHTEN FIX: We loggen in op de Platform sub, maar laden direct de Dev sub in als extra context!
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
          allow-no-subscriptions: true

      - name: Terraform Init (Base)
        working-directory: ./terraform/01_base
        run: terraform init

      # -------------------------------------------------------------------------
      # STEP 1 (PROFESSIONAL): Schoon de state op ALS de resource er per ongeluk in staat
      # -------------------------------------------------------------------------
      - name: Terraform State Clean
        working-directory: ./terraform/01_base
        run: |
          echo "Verwijderen van de onbeheerde vaultcore DNS-zone uit de Terraform State indien aanwezig..."
          terraform state rm module.keyvault.azurerm_private_dns_zone.kv_dns || true

      # -------------------------------------------------------------------------
      # STEP 2 (PROFESSIONAL): Gericht de wees-resources opruimen op de DEV subscription
      # -------------------------------------------------------------------------
      - name: Azure CLI Targeted Cleanup
        run: |
          echo "Schakel om naar de Development Subscription context via de OIDC credentials..."
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_DEV }}"
          
          echo "Verwijderen van de netwerklink van de vaultcore DNS-zone..."
          az network private-dns link vnet delete -g "rg-wlcs-logistics-dev-001" -z "privatelink.vaultcore.azure.net" -n "link-kv-dns-to-spoke" --yes || true
          
          echo "Verwijderen van de losstaande vaultcore DNS-zone..."
          az network private-dns zone delete -g "rg-wlcs-logistics-dev-001" -n "privatelink.vaultcore.azure.net" --yes || true

      # -------------------------------------------------------------------------
      # STEP 3: Veilige Terraform Destroy met behoud van je 'true' beveiligingsvlaggen
      # -------------------------------------------------------------------------
      - name: Terraform Destroy (Base Only)
        working-directory: ./terraform/01_base
        run: |
          terraform destroy -auto-approve \
            -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}" \
            -var "subscription_id_dev=${{ secrets.AZURE_SUBSCRIPTION_DEV }}"
