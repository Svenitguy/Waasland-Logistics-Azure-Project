name: "WLCS - Azure Base Infrastructure Destroy"

on:
  workflow_dispatch: # Handmatig te starten via de GitHub UI knop

permissions:
  id-token: write
  contents: read

jobs:
  destroy_base:
    name: "Destroy Core Base Infrastructure Only"
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}

      # -------------------------------------------------------------------------
      # PROFESSIONAL CLEANUP: Forceer de verwijdering van de spook-resources via CLI
      # -------------------------------------------------------------------------
      - name: Clean Unmanaged Spook Resources
        run: |
          echo "1. Key Vault deleten uit de Dev subscription..."
          az keyvault delete --name "kv-wlcs-log-dev-001" --subscription "${{ secrets.AZURE_SUBSCRIPTION_DEV }}" || true
          
          echo "2. Key Vault direct permanent purgen (omzeil de soft-delete prullenbak)..."
          az keyvault purge --name "kv-wlcs-log-dev-001" --location "northeurope" --subscription "${{ secrets.AZURE_SUBSCRIPTION_DEV }}" || true
          
          echo "3. De onbeheerde Private DNS zone voor vaultcore verwijderen..."
          az network private-dns zone delete --g "rg-wlcs-logistics-dev-001" --name "privatelink.vaultcore.azure.net" --subscription "${{ secrets.AZURE_SUBSCRIPTION_DEV }}" --yes || true

      # -------------------------------------------------------------------------
      # TERRAFORM DESTROY: Sloop de reguliere basis resources
      # -------------------------------------------------------------------------
      - name: Terraform Init (Base)
        working-directory: ./terraform/01_base
        run: terraform init

      - name: Terraform Destroy (Base Only)
        working-directory: ./terraform/01_base
        run: |
          terraform destroy -auto-approve \
            -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var "subscription_id_platform=${{ secrets.AZURE_SUBSCRIPTION_PLATFORM }}" \
            -var "subscription_id_dev=${{ secrets.AZURE_SUBSCRIPTION_DEV }}"
